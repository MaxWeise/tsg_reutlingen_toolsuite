[tox]
requires =
    tox>=4
env_list = py{310}, format, lint, type

[testenv]
description = run unit tests
deps = pytest>=7
commands = pytest {posargs:tests}

[testenv:format]
description = run formater
skip_install = true
deps = black>=23.10
commands = black {posargs:.}

[testenv:lint]
description = run linters
skip_install = true
deps = pylint>=3.0
commands = pylint {posargs:src tests}

[testenv:type]
description = run type checks
deps = mypy>=1.6
commands = mypy --ignore-missing-imports {posargs:src tests}

