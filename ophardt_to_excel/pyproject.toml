[project]
name = "ophardt-to-excel"
version = "1.0.0"
authors = [
    {name = "Max Weise", email = "fencingmax21@gmail.com"}
]
maintainers = [
    {name = "Max Weise", email = "fencingmax21@gmail.com"}
]
requires-python = ">=3.10"

dependencies = [
    "XlsxWriter == 3.1.9"
]

[build-system]
requires = [
    "setuptools>=42",
    "wheel",
]
build-backend = "setuptools.build_meta"

[project.optional-dependencies]
development = [
    "mypy>=1.6.1",
    "mypy-extensions>=1.0.0",
    "pytest>=7.4.3",
]

[tool.black]
line-length = 80
