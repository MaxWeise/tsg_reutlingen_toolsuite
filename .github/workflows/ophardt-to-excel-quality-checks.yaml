
name: Quality Checks for ophardt-to-excel

on:
  push:
    branches: [ "production", "ref-list/**", "ophardt-to-excel/**"]

x-python-versions:  &python-versions
  - "3.10"

jobs:
  unit-test:

    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: *python-versions

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: $SETUP_PYTHON_VERSION
      with:
        python-version: ${{ matrix.python-version }}

    - name: Setup uv
      uses: astral-sh/setup-uv@v1
      with:
        uv-version: latests

    - name: Install dependencies
      working-directory: $GITHUB_WORKSPACE/ophardt_to_excel
      run: |
        uv pip install --upgrade pip
        uv pip install tox tox-gh-actions

    - name: Run Tests
      working-directory: $GITHUB_WORKSPACE/ophardt_to_excel
      run: tox -e test

  linter:

    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: *python-versions

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      working-directory: $GITHUB_WORKSPACE/ophardt_to_excel
      run: |
        uv pip install --upgrade pip
        uv pip install tox tox-gh-actions

    - name: Run Linter
      working-directory: $GITHUB_WORKSPACE/ophardt_to_excel
      run: tox -e lint
