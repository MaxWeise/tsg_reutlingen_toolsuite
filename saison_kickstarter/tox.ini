[tox]
requires =
    tox>=4
env_list = py310, py311, py312, type, test, lint

[testenv:test]
description = run unit tests
deps =  pytest>=7,
        pytest-cov>=5
extras = development
commands = pytest --no-cov {posargs:tests}

[testenv:format]
description = run formater
skip_install = true
deps = black>=23.10
commands = black {posargs:.}

[testenv:lint]
description = run linters
skip_install = true
deps = pylint>=3.0
commands = pylint src tests --fail-under=5

[testenv:type]
description = run type checks
deps = mypy>=1.6
commands = mypy --ignore-missing-imports {posargs:src tests}

