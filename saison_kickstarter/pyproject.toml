[project]
name = "saison-kickstarter"
version = "0.0.1"
authors = [
    {name = "Max Weise", email = "fencingmax21@gmail.com"}
]
maintainers = [
    {name = "Max Weise", email = "fencingmax21@gmail.com"}
]
requires-python = ">=3.10"

dependencies = [
    "XlsxWriter == 3.1.9"
]

[build-system]
requires = [
    "setuptools>=42",
    "wheel",
]
build-backend = "setuptools.build_meta"

[project.optional-dependencies]
development = [
    "mypy>=1.6.1",
    "mypy-extensions>=1.0.0",
    "pytest>=7.4.3",
    "pylint>=3.0",
    "tox>=4.12",
    "pandas==2.2.0",
    "openpyxl==3.1.2",
    "pyarrow==15.0.0",
]

[tool.black]
line-length = 80
