[project]
name = "saison-kickstarter"
version = "3.0.0"
authors = [
    {name = "Max Weise", email = "fencingmax21@gmail.com"}
]
maintainers = [
    {name = "Max Weise", email = "fencingmax21@gmail.com"}
]
requires-python = ">=3.10"

dependencies = [
    "XlsxWriter == 3.1.9",
]

[build-system]
requires = [
    "setuptools>=42",
    "wheel",
]
build-backend = "setuptools.build_meta"

[project.optional-dependencies]
development = [
]

[project.scripts]
saison-kickstarter = "saison_kickstarter.main:main"

[tool.black]
line-length = 80

[tool.ruff]
line-length = 80
indent-width = 4

[tool.ruff.lint]
select = ["C90", "F", "N", "PT"]

[dependency-groups]
dev = [
    "pytest>=8.4.1",
    "mypy>=1.6.1",
    "mypy-extensions>=1.0.0",
    "pylint>=3.0",
    "tox>=4.12",
    "pandas==2.2.0",
    "openpyxl==3.1.2",
    "pyarrow==15.0.0",
    "pytest-sugar>=1.0.0",
    "numpy>=1.26.4",
]
