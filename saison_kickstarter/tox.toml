requires = ["tox>=4"]
env_list = ["py310", "py311", "py312", "py313", "type", "test", "lint"]

[env.test]
description = "run unit tests"
deps =  [
    "pytest",
    "pytest-sugar",
]
dependency_groups = ["dev"]
commands = [[ "pytest", "-q" ]]

[env.lint]
description = "run linters"
skip_install = true
deps = ["pylint>=3.0",]
commands = [["pylint", "saison-kickstarter", "tests", "--fail-under=5"]]

[env.type]
description = "run type checks"
deps = ["mypy>=1.6"]
commands = [["mypy", "--ignore-missing-imports", "saison_kickstarter", "tests"]]

